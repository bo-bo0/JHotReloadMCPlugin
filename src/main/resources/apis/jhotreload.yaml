name: JHotReload

neoforge-1.21.1:
  gradle: |
    def jhotreloadLibrary =
        files(rootProject.file(".jhotreload/JHotReload.jar"))

    def jhotreloadRuntimeDirectory =
        rootProject.file("run/JHotReload")

    def jhotreloadPluginSettings =
        rootProject.file(".jhotreload-plugin.json")

    def jhotreloadReleaseDirectory =
        layout.buildDirectory.dir("generated/jhotreload-release")

    dependencies {
        implementation jhotreloadLibrary
        additionalRuntimeClasspath jhotreloadLibrary
        jarJar jhotreloadLibrary
    }

    def generateJHotReloadReleaseConfig =
        tasks.register("generateJHotReloadReleaseConfig") {
            def sourceConfig =
                new File(
                    jhotreloadRuntimeDirectory,
                    "@CONFIGJHotReload.json"
                )

            outputs.dir(jhotreloadReleaseDirectory)

            outputs.upToDateWhen {
                false
            }

            doLast {
                def outputDirectory =
                    jhotreloadReleaseDirectory.get().asFile

                outputDirectory.mkdirs()

                def releaseConfig = [:]

                if (sourceConfig.exists()) {
                    releaseConfig.putAll(
                        new groovy.json.JsonSlurper()
                            .parse(sourceConfig) as Map
                    )
                }

                def keepJHotReloadActive = false

                if (jhotreloadPluginSettings.exists()) {
                    def pluginSettings =
                        new groovy.json.JsonSlurper()
                            .parse(jhotreloadPluginSettings)

                    keepJHotReloadActive =
                        pluginSettings["keepActiveInExportedMods"] == true
                }

                releaseConfig["isJHotReloadActive"] =
                    keepJHotReloadActive

                def outputConfig =
                    new File(
                        outputDirectory,
                        "@CONFIGJHotReload.json"
                    )

                outputConfig.text =
                    groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(
                            releaseConfig
                        )
                    )
            }
        }

    tasks.named("jar") {
        dependsOn generateJHotReloadReleaseConfig

        from(jhotreloadRuntimeDirectory) {
            include "**/*.json"
            exclude "@CONFIGJHotReload.json"
            into "META-INF/jhotreload"
        }

        from(jhotreloadReleaseDirectory) {
            include "@CONFIGJHotReload.json"
            into "META-INF/jhotreload"
        }
    }

